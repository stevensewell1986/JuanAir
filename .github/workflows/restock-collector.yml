name: Restock collector

# Watches YATA's foreign stock feed and weav3r.dev bazaar prices, and publishes restock.json
# plus one small price-history file per item (hist/) on the "data" branch.
# The JuanAir userscript reads that one file.
#
# GitHub's own timer is unreliable for short intervals, so each run starts the next one
# when it finishes. The timer below is only a safety net that restarts the chain if it stops.
# Only one run is ever active at a time (see "concurrency").

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: restock-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the collector (skips the videos)
        uses: actions/checkout@v4
        with:
          sparse-checkout: collector

      - name: Load what has been learned so far
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
          fi
          [ -s data/restock.json ] || echo '{}' > data/restock.json

      - name: Watch YATA and check bazaar prices
        run: node collector/collect.js data/restock.json

      - name: Publish the data branch
        run: |
          cd data
          git init -q -b data
          git config user.name "restock-collector"
          git config user.email "restock-collector@users.noreply.github.com"
          git add -A
          git commit -qm "Restock data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then sleep 120; fi
          gh workflow run restock-collector.yml --repo "${{ github.repository }}" --ref main
